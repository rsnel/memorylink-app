plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStoreFile = System.getenv("MEMORYLINK_STORE_FILE") ?: keystoreProps.getProperty("storeFile")
def releaseStorePassword = System.getenv("MEMORYLINK_STORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def releaseKeyAlias = System.getenv("MEMORYLINK_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("MEMORYLINK_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.memorylink.photoframe'
    compileSdk 34

    defaultConfig {
        applicationId "com.memorylink.photoframe"
        minSdk 24
        targetSdk 34
        // Bump versionCode before building an APK you intend to push to the frame.
        versionCode 9
        versionName "1.8"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Intentionally no external libraries: the app uses only the Android SDK
    // and kotlin-stdlib (provided by the Kotlin plugin).
}
