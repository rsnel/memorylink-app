name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be used in step-level `if` conditions, so
      # expose a boolean via the environment and test that instead.
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Name release APK with version
        if: env.HAS_RELEASE_KEY == 'true'
        id: release_apk
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          NAME="MemoryLink-${VERSION_NAME}-v${VERSION_CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "artifact=${NAME%.apk}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_RELEASE_KEY != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_apk.outputs.artifact }}
          path: ${{ steps.release_apk.outputs.path }}
          if-no-files-found: error

      - name: Upload debug APK
        if: env.HAS_RELEASE_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
