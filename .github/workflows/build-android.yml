name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be used in step-level `if` conditions, so
      # expose a boolean via the environment and test that instead.
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Used as the APK versionCode and in the artifact filename.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_RELEASE_KEY != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Name APK with build number
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            SUFFIX=""
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            SUFFIX="-debug"
          fi
          NAME="MemoryLink-${BUILD_NUMBER}${SUFFIX}.apk"
          cp "$SRC" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
